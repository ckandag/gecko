description: NodePool enables declarative management of a pool of nodes.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: NodePoolSpec defines the NodePool behavior.
    properties:
      autoscaling:
        properties:
          max:
            format: int32
            maximum: 500
            minimum: 1
            type: integer
          min:
            format: int32
            minimum: 0
            type: integer
        required:
        - max
        - min
        type: object
        x-kubernetes-validations:
        - message: max must be greater than or equal to min
          rule: self.max >= self.min
      clusterID:
        maxLength: 253
        minLength: 1
        type: string
        x-kubernetes-validations:
        - message: clusterID is immutable
          rule: self == oldSelf
        - message: clusterID must consist of lowercase alphanumeric characters or
            '-', start and end with an alphanumeric character, and be between 1 and
            253 characters
          rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      nodeCount:
        format: int32
        minimum: 0
        type: integer
      nodeLabels:
        additionalProperties:
          type: string
        maxProperties: 50
        type: object
      platform:
        properties:
          gcp:
            properties:
              diskSizeGB:
                default: 64
                format: int64
                maximum: 65536
                minimum: 20
                type: integer
              diskType:
                default: pd-balanced
                enum:
                - pd-standard
                - pd-ssd
                - pd-balanced
                type: string
              machineType:
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: machineType must start and end with a lowercase letter
                    or digit, and contain only lowercase letters, digits, and hyphens
                  rule: self.matches('^[a-z0-9]+(-[a-z0-9]+)*$')
              networkTags:
                items:
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              onHostMaintenance:
                enum:
                - MIGRATE
                - TERMINATE
                type: string
              provisioningModel:
                default: Standard
                enum:
                - Standard
                - Spot
                - Preemptible
                type: string
              resourceLabels:
                items:
                  description: GCPResourceLabel is a label applied to GCP resources.
                  properties:
                    key:
                      maxLength: 63
                      minLength: 1
                      type: string
                    value:
                      maxLength: 63
                      type: string
                  required:
                  - key
                  type: object
                maxItems: 60
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              subnet:
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: subnet is immutable
                  rule: self == oldSelf
                - message: 'subnet must be a valid GCP subnet name: start with a lowercase
                    letter, contain only lowercase letters, digits, or hyphens, and
                    end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              zone:
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: zone must be in the form of region-zone (e.g., us-central1-a)
                  rule: self.matches('^[a-z]+(?:-[a-z0-9]+)*-[a-z]$')
                - message: zone is immutable
                  rule: self == oldSelf
            required:
            - machineType
            - subnet
            - zone
            type: object
          type:
            enum:
            - GCP
            type: string
        required:
        - type
        type: object
      release:
        description: NodePoolReleaseSpec defines the complete OpenShift release to
          install on a node pool.
        properties:
          channelGroup:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
          version:
            maxLength: 63
            minLength: 1
            type: string
            x-kubernetes-validations:
            - message: version must be a valid semantic version with an optional prerelease
                and without a leading 'v' (e.g., 4.14.9 or 5.0.0-ec.6)
              rule: self.matches('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$')
        required:
        - channelGroup
        - version
        type: object
      taints:
        items:
          description: |-
            TaintSpec is as v1 Core but without TimeAdded.
            https://github.com/kubernetes/kubernetes/blob/ed8cad1e80d096257921908a52ac69cf1f41a098/staging/src/k8s.io/api/core/v1/types.go#L3037-L3053
            Validation replicates the same validation as the upstream https://github.com/kubernetes/kubernetes/blob/9a2a7537f035969a68e432b4cc276dbce8ce1735/pkg/util/taints/taints.go#L273.
            See also https://kubernetes.io/docs/concepts/overview/working-with-objects/names/.
          properties:
            effect:
              enum:
              - NoSchedule
              - PreferNoSchedule
              - NoExecute
              type: string
            key:
              maxLength: 253
              minLength: 1
              type: string
              x-kubernetes-validations:
              - message: key must be a qualified name with an optional subdomain prefix
                  e.g. example.com/MyName
                rule: self.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\\/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
            value:
              maxLength: 63
              type: string
              x-kubernetes-validations:
              - message: Value must start and end with alphanumeric characters and
                  can only contain '-', '_', '.' in the middle
                rule: self.matches('^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$')
          required:
          - effect
          - key
          type: object
        maxItems: 50
        type: array
        x-kubernetes-list-map-keys:
        - key
        - effect
        x-kubernetes-list-type: map
      upgrade:
        description: NodePoolUpgradeSpec requests one customer-initiated upgrade.
        nullable: true
        properties:
          startTime:
            format: date-time
            type: string
          targetVersion:
            maxLength: 63
            minLength: 1
            type: string
        type: object
    required:
    - clusterID
    - platform
    - release
    type: object
    x-kubernetes-validations:
    - message: nodeCount and autoscaling are mutually exclusive
      rule: '!has(self.nodeCount) || !has(self.autoscaling)'
  status:
    description: NodePoolStatus is written by controllers only.
    properties:
      conditions:
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - type
        x-kubernetes-list-type: map
      currentVersion:
        type: string
      upgrade:
        description: NodePoolUpgradeResult records the current or most recent upgrade.
        properties:
          acceptedTime:
            format: date-time
            type: string
          completedTime:
            format: date-time
            type: string
          failureMessage:
            maxLength: 1024
            type: string
          failureReason:
            maxLength: 63
            type: string
          requestedTime:
            format: date-time
            type: string
          startedTime:
            format: date-time
            type: string
          targetVersion:
            maxLength: 63
            minLength: 1
            type: string
        required:
        - targetVersion
        type: object
    type: object
required:
- spec
type: object
