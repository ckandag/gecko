description: Cluster enables declarative management of OpenShift Clusters on GCP.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: ClusterSpec defines the Cluster behavior.
    properties:
      dns:
        description: DNSSpec specifies the DNS configuration for the cluster ingress.
        properties:
          baseDomain:
            maxLength: 253
            type: string
            x-kubernetes-validations:
            - message: baseDomain must be a valid domain name (e.g., example, example.com,
                sub.example.com)
              rule: self == "" || self.matches('^(?:(?:[a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}|[a-zA-Z0-9-]+)$')
            - message: baseDomain is immutable
              rule: oldSelf == "" || self == oldSelf
        required:
        - baseDomain
        type: object
      infraID:
        maxLength: 253
        minLength: 1
        type: string
        x-kubernetes-validations:
        - message: infraID must consist of lowercase alphanumeric characters or '-',
            start and end with an alphanumeric character, and be between 1 and 253
            characters
          rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: infraID is immutable
          rule: oldSelf == "" || self == oldSelf
      issuerURL:
        default: https://kubernetes.default.svc
        maxLength: 255
        type: string
        x-kubernetes-validations:
        - message: issuerURL is immutable
          rule: self == oldSelf
        - message: issuerURL must be a valid absolute URL
          rule: isURL(self)
      networking:
        properties:
          clusterNetwork:
            items:
              properties:
                cidr:
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: cidr must be a valid IPv4 or IPv6 CIDR notation (e.g.,
                      192.168.1.0/24 or 2001:db8::/64)
                    rule: self.matches('^((\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})$') ||
                      self.matches('^([0-9a-fA-F]{0,4}:){2,7}([0-9a-fA-F]{0,4})?/[0-9]{1,3}$')
                hostPrefix:
                  format: int32
                  type: integer
              required:
              - cidr
              type: object
            maxItems: 2
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: clusterNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
          machineNetwork:
            items:
              properties:
                cidr:
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: cidr must be a valid IPv4 or IPv6 CIDR notation (e.g.,
                      192.168.1.0/24 or 2001:db8::/64)
                    rule: self.matches('^((\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})$') ||
                      self.matches('^([0-9a-fA-F]{0,4}:){2,7}([0-9a-fA-F]{0,4})?/[0-9]{1,3}$')
              required:
              - cidr
              type: object
            maxItems: 2
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: machineNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
          networkType:
            default: OVNKubernetes
            enum:
            - OVNKubernetes
            - Other
            type: string
            x-kubernetes-validations:
            - message: networkType is immutable
              rule: self == oldSelf
          serviceNetwork:
            items:
              type: string
            maxItems: 1
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: serviceNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
        type: object
      platform:
        description: ClusterPlatformSpec defines the behavior of the infrastructure
          provider.
        properties:
          gcp:
            description: GCPClusterPlatform defines the behavior of the GCP infrastructure
              provider.
            properties:
              endpointAccess:
                default: Private
                enum:
                - PublicAndPrivate
                - Private
                type: string
              network:
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: network is immutable
                  rule: self == oldSelf
                - message: 'network must be a valid GCP network name: start with a
                    lowercase letter, contain only lowercase letters, digits, or hyphens,
                    and end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              projectID:
                maxLength: 30
                minLength: 6
                type: string
                x-kubernetes-validations:
                - message: project must start with a lowercase letter, contain only
                    lowercase letters, digits, or hyphens, and end with a letter or
                    digit
                  rule: self.matches('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')
                - message: projectID is immutable
                  rule: self == oldSelf
              region:
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: region must be a valid GCP region (e.g., us-central1, europe-west2)
                  rule: self.matches('^[a-z]+-[a-z]+[0-9]+$')
                - message: region is immutable
                  rule: self == oldSelf
              resourceLabels:
                items:
                  description: GCPResourceLabel is a label applied to GCP resources.
                  properties:
                    key:
                      maxLength: 63
                      minLength: 1
                      type: string
                    value:
                      maxLength: 63
                      type: string
                  required:
                  - key
                  type: object
                maxItems: 60
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              subnet:
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: subnet is immutable
                  rule: self == oldSelf
                - message: 'subnet must be a valid GCP subnet name: start with a lowercase
                    letter, contain only lowercase letters, digits, or hyphens, and
                    end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              workloadIdentity:
                description: WorkloadIdentitySpec defines Workload Identity Federation
                  for the cluster.
                properties:
                  poolID:
                    maxLength: 32
                    minLength: 4
                    type: string
                    x-kubernetes-validations:
                    - message: poolID must start with a lowercase letter, contain
                        only lowercase letters, digits, or hyphens, and end with a
                        letter or digit
                      rule: self.matches('^[a-z][a-z0-9-]{2,30}[a-z0-9]$')
                    - message: poolID cannot start with reserved prefix 'gcp-'
                      rule: '!self.startsWith(''gcp-'')'
                    - message: poolID is immutable
                      rule: self == oldSelf
                  projectNumber:
                    maxLength: 25
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: projectNumber must contain only digits
                      rule: self.matches('^[0-9]+$')
                    - message: projectNumber is immutable
                      rule: self == oldSelf
                  providerID:
                    maxLength: 32
                    minLength: 4
                    type: string
                    x-kubernetes-validations:
                    - message: providerID must start with a lowercase letter, contain
                        only lowercase letters, digits, or hyphens, and end with a
                        letter or digit
                      rule: self.matches('^[a-z][a-z0-9-]{2,30}[a-z0-9]$')
                    - message: providerID cannot start with reserved prefix 'gcp-'
                      rule: '!self.startsWith(''gcp-'')'
                    - message: providerID is immutable
                      rule: self == oldSelf
                  serviceAccountsRef:
                    properties:
                      cloudControllerEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: cloudControllerEmail is immutable
                          rule: self == oldSelf
                      controlPlaneEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: controlPlaneEmail is immutable
                          rule: self == oldSelf
                      imageRegistryEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: imageRegistryEmail is immutable
                          rule: self == oldSelf
                      networkEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: networkEmail is immutable
                          rule: self == oldSelf
                      nodePoolEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: nodePoolEmail is immutable
                          rule: self == oldSelf
                      storageEmail:
                        type: string
                        x-kubernetes-validations:
                        - message: storageEmail is immutable
                          rule: self == oldSelf
                    required:
                    - cloudControllerEmail
                    - controlPlaneEmail
                    - imageRegistryEmail
                    - networkEmail
                    - nodePoolEmail
                    - storageEmail
                    type: object
                required:
                - poolID
                - projectNumber
                - providerID
                - serviceAccountsRef
                type: object
                x-kubernetes-validations:
                - message: workloadIdentity is immutable
                  rule: self == oldSelf
            required:
            - network
            - projectID
            - region
            - subnet
            - workloadIdentity
            type: object
          type:
            enum:
            - GCP
            type: string
        required:
        - gcp
        - type
        type: object
      release:
        description: |-
          ReleaseSpec defines the target OCP release version.
          The version-resolution adapter resolves Version+ChannelGroup to a release image pullspec.
        properties:
          channelGroup:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
          version:
            maxLength: 63
            minLength: 1
            type: string
            x-kubernetes-validations:
            - message: version must be a valid semantic version with an optional prerelease
                and without a leading 'v' (e.g., 4.14.9 or 5.0.0-ec.6)
              rule: self.matches('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$')
        required:
        - channelGroup
        - version
        type: object
    required:
    - networking
    - platform
    - release
    type: object
  status:
    description: ClusterStatus is written by controllers only.
    properties:
      conditions:
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - type
        x-kubernetes-list-type: map
      controlPlaneUpgrade:
        description: |-
          ControlPlaneUpgradeResult holds the control-plane-upgrade controller's decision
          state. This field is read-only — populated by the control-plane-upgrade
          controller only. The controller reads HostedClusterResult for feedback but
          never writes it.
        properties:
          completedAt:
            format: date-time
            type: string
          failureMessage:
            type: string
          failureReason:
            type: string
          requestedAt:
            format: date-time
            type: string
          targetSource:
            enum:
            - automatic
            - customer
            type: string
          targetVersion:
            type: string
        type: object
      hostedClusterResult:
        description: |-
          HostedClusterResult holds the hc-adapter's output from ManifestWork status feedback.
          This field is read-only — populated by the hc-adapter only.
        properties:
          apiEndpoint:
            type: string
          version:
            type: string
        type: object
    type: object
required:
- spec
type: object
