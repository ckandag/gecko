properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: ControlPlaneUpgradeRequestSpec identifies the Cluster and selected
      target.
    properties:
      clusterID:
        maxLength: 253
        minLength: 1
        type: string
      targetVersion:
        maxLength: 63
        minLength: 1
        type: string
    required:
    - clusterID
    - targetVersion
    type: object
  status:
    description: |-
      ControlPlaneUpgradeRequestStatus records the controller's decision on this
      request. Rollout progress remains on Cluster.status.controlPlaneUpgrade.
    properties:
      decidedTime:
        description: decidedTime is when the decision was recorded.
        format: date-time
        type: string
      decision:
        description: |-
          decision is the outcome of the request: Accepted or Rejected. It is omitted
          while the request is awaiting a decision.
        enum:
        - Accepted
        - Rejected
        maxLength: 8
        type: string
      reason:
        description: |-
          reason is a short code explaining the decision, such as UpgradeRequested
          for an accepted request, or UpgradeInProgress or TargetNotAvailable for a
          rejected request.
        maxLength: 63
        type: string
    type: object
required:
- spec
type: object
