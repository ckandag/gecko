description: Cluster enables declarative management of OpenShift Clusters on GCP.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec defines the desired behavior of the Cluster.
    properties:
      dns:
        description: DNSSpec specifies the DNS configuration for the cluster ingress.
        properties:
          baseDomain:
            description: |-
              baseDomain is the base domain of the cluster.
              It will be used to configure ingress in the cluster through the subdomain baseDomainPrefix.baseDomain.
              If baseDomainPrefix is omitted, the Cluster.name will be used as the subdomain.
              Once set, this field is immutable.
              When the value is the empty string "", the controller might default to a value depending on the platform.
            maxLength: 253
            type: string
            x-kubernetes-validations:
            - message: baseDomain must be a valid domain name (e.g., example, example.com,
                sub.example.com)
              rule: self == "" || self.matches('^(?:(?:[a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}|[a-zA-Z0-9-]+)$')
            - message: baseDomain is immutable
              rule: oldSelf == "" || self == oldSelf
        required:
        - baseDomain
        type: object
      infraID:
        description: |-
          infraID is a globally unique identifier for the cluster.
          It must consist of lowercase alphanumeric characters and hyphens ('-') only, and start and end with an alphanumeric character.
          It must be no more than 253 characters in length.
          This identifier will be used to associate various cloud resources with the Cluster and its associated NodePools.
          If a value is not specified, a random infraID will be generated and set by the controller.
          Once set, this value is immutable.
        maxLength: 253
        minLength: 1
        type: string
        x-kubernetes-validations:
        - message: infraID must consist of lowercase alphanumeric characters or '-',
            start and end with an alphanumeric character, and be between 1 and 253
            characters
          rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: infraID is immutable
          rule: oldSelf == "" || self == oldSelf
      issuerURL:
        default: https://kubernetes.default.svc
        description: |-
          issuerURL is an OIDC issuer URL which will be used as the issuer in all
          ServiceAccount tokens generated by the control plane API server via --service-account-issuer kube api server flag.
          https://k8s-docs.netlify.app/en/docs/reference/command-line-tools-reference/kube-apiserver/
          https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#serviceaccount-token-volume-projection
          The default value is https://kubernetes.default.svc, which only works for in-cluster
          validation.
        maxLength: 255
        type: string
        x-kubernetes-validations:
        - message: issuerURL is immutable
          rule: self == oldSelf
        - message: issuerURL must be a valid absolute URL
          rule: isURL(self)
      networking:
        description: networking defines the network topology for the cluster.
        properties:
          clusterNetwork:
            description: |-
              clusterNetwork is the list of IP address pools for pods.
              Defaults to [{cidr: "10.132.0.0/14"}].
              Currently only one entry is supported.
              This field is immutable.
            items:
              properties:
                cidr:
                  description: cidr is the IP block address pool for the cluster itself.
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: cidr must be a valid IPv4 or IPv6 CIDR notation (e.g.,
                      192.168.1.0/24 or 2001:db8::/64)
                    rule: self.matches('^((\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})$') ||
                      self.matches('^([0-9a-fA-F]{0,4}:){2,7}([0-9a-fA-F]{0,4})?/[0-9]{1,3}$')
                hostPrefix:
                  description: |-
                    hostPrefix is the prefix size to allocate to each node from the CIDR.
                    For example, 24 would allocate 2^(32-24)=2^8=256 addresses to each node. If this
                    field is not used by the plugin, it can be left unset.
                  format: int32
                  type: integer
              required:
              - cidr
              type: object
            maxItems: 2
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: clusterNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
          machineNetwork:
            description: |-
              machineNetwork is the list of IP address pools for machines.
              This might be used among other things to generate appropriate networking security groups in some clouds providers.
              Currently only one entry or two for dual stack is supported.
              This field is immutable.
            items:
              properties:
                cidr:
                  description: cidr is the IP block address pool for machines within
                    the cluster.
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: cidr must be a valid IPv4 or IPv6 CIDR notation (e.g.,
                      192.168.1.0/24 or 2001:db8::/64)
                    rule: self.matches('^((\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})$') ||
                      self.matches('^([0-9a-fA-F]{0,4}:){2,7}([0-9a-fA-F]{0,4})?/[0-9]{1,3}$')
              required:
              - cidr
              type: object
            maxItems: 2
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: machineNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
          networkType:
            default: OVNKubernetes
            description: |-
              networkType specifies the SDN provider used for cluster networking.
              Defaults to OVNKubernetes. This field is immutable.
            enum:
            - OVNKubernetes
            - Other
            type: string
            x-kubernetes-validations:
            - message: networkType is immutable
              rule: self == oldSelf
          serviceNetwork:
            description: |-
              serviceNetwork is the list of IP address pools for services.
              Defaults to ["172.31.0.0/16"].
              Currently only one entry is supported.
              This field is immutable.
            items:
              type: string
            maxItems: 1
            minItems: 1
            type: array
            x-kubernetes-list-type: atomic
            x-kubernetes-validations:
            - message: serviceNetwork is immutable and cannot be modified once set.
              rule: self == oldSelf
        type: object
      platform:
        description: |-
          platform specifies the underlying infrastructure provider for the cluster
          and is used to configure platform specific behavior.
        properties:
          gcp:
            description: |-
              gcp specifies the behavior of the Google Cloud Platform - GCP
              infrastructure provider.
            properties:
              endpointAccess:
                default: Private
                description: |-
                  endpointAccess controls API endpoint accessibility for the HostedControlPlane.
                  Allowed values: "Private", "PublicAndPrivate". Defaults to "Private".
                enum:
                - PublicAndPrivate
                - Private
                type: string
              network:
                description: network is the VPC network name.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: network is immutable
                  rule: self == oldSelf
                - message: 'network must be a valid GCP network name: start with a
                    lowercase letter, contain only lowercase letters, digits, or hyphens,
                    and end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              projectID:
                description: |-
                  project is the GCP project ID.
                  A valid project ID must satisfy the following rules:
                    length: Must be between 6 and 30 characters, inclusive
                    characters: Only lowercase letters (`a-z`), digits (`0-9`), and hyphens (`-`) are allowed
                    start and end: Must begin with a lowercase letter and must not end with a hyphen
                    valid examples: "my-project", "my-project-1", "my-project-123".
                  See https://cloud.google.com/resource-manager/docs/creating-managing-projects for project ID naming rules.
                maxLength: 30
                minLength: 6
                type: string
                x-kubernetes-validations:
                - message: project must start with a lowercase letter, contain only
                    lowercase letters, digits, or hyphens, and end with a letter or
                    digit
                  rule: self.matches('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')
                - message: projectID is immutable
                  rule: self == oldSelf
              region:
                description: |-
                  region is the GCP region in which the cluster resides (e.g., us-central1, europe-west2).
                  Must start with lowercase letters, contain exactly one hyphen, and end with digits.
                  For a full list of valid regions, see: https://cloud.google.com/compute/docs/regions-zones.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: region must be a valid GCP region (e.g., us-central1, europe-west2)
                  rule: self.matches('^[a-z]+-[a-z]+[0-9]+$')
                - message: region is immutable
                  rule: self == oldSelf
              resourceLabels:
                description: |-
                  resourceLabels are applied to all GCP resources created for the cluster.
                  Labels are key-value pairs used for organizing and managing GCP resources.
                  Changes to this field will be propagated in-place to GCP resources where supported.
                  GCP supports a maximum of 64 labels per resource. HyperShift reserves approximately 4 labels for system use.
                  For GCP labeling guidance, see https://cloud.google.com/compute/docs/labeling-resources
                items:
                  description: GCPResourceLabel is a label applied to GCP resources.
                  properties:
                    key:
                      maxLength: 63
                      minLength: 1
                      type: string
                    value:
                      maxLength: 63
                      type: string
                  required:
                  - key
                  type: object
                maxItems: 60
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              subnet:
                description: subnet is the subnet name for Private Service Connect
                  endpoints.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: subnet is immutable
                  rule: self == oldSelf
                - message: 'subnet must be a valid GCP subnet name: start with a lowercase
                    letter, contain only lowercase letters, digits, or hyphens, and
                    end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              workloadIdentity:
                description: |-
                  workloadIdentity configures Workload Identity Federation for the cluster.
                  This enables secure, short-lived token-based authentication without storing
                  long-term service account keys. These fields are immutable after cluster creation
                  to prevent breaking the authentication chain.

                  Prerequisites for WIF setup:
                    - Workload Identity Pool and Provider must exist in the GCP project
                    - Provider must be configured with audience mapping for OpenShift SA tokens
                    - Target Google Service Account must have roles/iam.workloadIdentityUser
                      granted to the workload pool principal (e.g., principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/subject/system:serviceaccount:kube-system:capi-gcp-controller-manager)
                    - Attribute mappings on the provider should include google.subject for token subject verification
                properties:
                  poolID:
                    description: |-
                      poolID is the workload identity pool identifier within the project.
                      This pool is used to manage external identity mappings.
                      Must be 4-32 characters and start with a lowercase letter.
                      Allowed characters: lowercase letters (a-z), digits (0-9), hyphens (-).
                      Cannot start or end with a hyphen.
                      The prefix "gcp-" is reserved by Google and cannot be used.
                      See https://cloud.google.com/iam/docs/manage-workload-identity-pools-providers for naming rules.

                      This is a user-provided value referencing a pre-created Workload Identity Pool.
                      Typically obtained from the output of `hypershift infra create gcp` which creates
                      the WIF infrastructure and generates appropriate pool IDs.
                    maxLength: 32
                    minLength: 4
                    type: string
                    x-kubernetes-validations:
                    - message: poolID must start with a lowercase letter, contain
                        only lowercase letters, digits, or hyphens, and end with a
                        letter or digit
                      rule: self.matches('^[a-z][a-z0-9-]{2,30}[a-z0-9]$')
                    - message: poolID cannot start with reserved prefix 'gcp-'
                      rule: '!self.startsWith(''gcp-'')'
                    - message: poolID is immutable
                      rule: self == oldSelf
                  projectNumber:
                    description: |-
                      projectNumber is the numeric GCP project identifier for WIF configuration.
                      This differs from the project ID and is required for workload identity pools.
                      Must be a numeric string representing the GCP project number.
                      See https://cloud.google.com/resource-manager/docs/creating-managing-projects for project number details.

                      This is a user-provided value obtained from GCP (found in GCP Console or via `gcloud projects describe PROJECT_ID`).
                      Also available in the output of `hypershift infra create gcp`.
                    maxLength: 25
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: projectNumber must contain only digits
                      rule: self.matches('^[0-9]+$')
                    - message: projectNumber is immutable
                      rule: self == oldSelf
                  providerID:
                    description: |-
                      providerID is the workload identity provider identifier within the pool.
                      This provider handles the token exchange between external and GCP identities.
                      Must be 4-32 characters and start with a lowercase letter.
                      Allowed characters: lowercase letters (a-z), digits (0-9), hyphens (-).
                      Cannot start or end with a hyphen.
                      The prefix "gcp-" is reserved by Google and cannot be used.
                      See https://cloud.google.com/iam/docs/manage-workload-identity-pools-providers for naming rules.

                      This is a user-provided value referencing a pre-created OIDC Provider within the WIF Pool.
                      Typically obtained from the output of `hypershift infra create gcp`.
                    maxLength: 32
                    minLength: 4
                    type: string
                    x-kubernetes-validations:
                    - message: providerID must start with a lowercase letter, contain
                        only lowercase letters, digits, or hyphens, and end with a
                        letter or digit
                      rule: self.matches('^[a-z][a-z0-9-]{2,30}[a-z0-9]$')
                    - message: providerID cannot start with reserved prefix 'gcp-'
                      rule: '!self.startsWith(''gcp-'')'
                    - message: providerID is immutable
                      rule: self == oldSelf
                  serviceAccountsRef:
                    description: |-
                      serviceAccountsEmails contains email addresses of various Google Service Accounts
                      required to enable integrations for different controllers and operators.
                      This follows the AWS pattern of having different roles for different purposes.
                    properties:
                      cloudControllerEmail:
                        description: |-
                          cloudController is the Google Service Account email for the Cloud Controller Manager
                          that manages LoadBalancer services and node lifecycle in the hosted cluster.
                          This GSA requires the following IAM roles:
                          - roles/compute.loadBalancerAdmin (Load Balancer Admin - for provisioning GCP load balancers)
                          - roles/compute.securityAdmin (Security Admin - for managing firewall rules)
                          - roles/compute.viewer (Compute Viewer - for reading instance metadata for node management)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: cloudControllerEmail is immutable
                          rule: self == oldSelf
                      controlPlaneEmail:
                        description: |-
                          controlPlane is the Google Service Account email for the Control Plane Operator
                          that manages control plane infrastructure and resources.
                          This GSA requires the following IAM roles:
                          - roles/dns.admin (DNS Admin - for managing DNS records)
                          - roles/compute.networkAdmin (Compute Network Admin - for network management)
                          - roles/compute.viewer (Compute Viewer - for CCM to read instance metadata)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: controlPlaneEmail is immutable
                          rule: self == oldSelf
                      imageRegistryEmail:
                        description: |-
                          imageRegistry is the Google Service Account email for the Image Registry Operator
                          that manages GCS storage for the internal container image registry.
                          This GSA requires the following IAM roles:
                          - roles/storage.admin (Storage Admin - for creating and managing GCS buckets and objects)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: imageRegistryEmail is immutable
                          rule: self == oldSelf
                      networkEmail:
                        description: |-
                          network is the Google Service Account email for the Cloud Network Config Controller
                          that manages cloud-level network configurations (egress IPs, subnets).
                          This GSA requires the following IAM roles:
                          - roles/compute.instanceAdmin.v1 (Compute Instance Admin - for managing network interfaces)
                          - roles/compute.networkUser (Compute Network User - for using subnets)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: networkEmail is immutable
                          rule: self == oldSelf
                      nodePoolEmail:
                        description: |-
                          nodePool is the Google Service Account email for CAPG controllers
                          that manage NodePool infrastructure (VMs, networks, disks, etc.).
                          This GSA requires the following IAM roles:
                          - roles/compute.instanceAdmin.v1 (Compute Instance Admin v1)
                          - roles/compute.networkAdmin (Compute Network Admin)
                          - roles/iam.serviceAccountUser (Service Account User - to attach service accounts to VMs)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: nodePoolEmail is immutable
                          rule: self == oldSelf
                      storageEmail:
                        description: |-
                          storage is the Google Service Account email for the GCP PD CSI Driver
                          that manages Persistent Disk storage operations (create, attach, delete volumes).
                          This GSA requires the following IAM roles:
                          - roles/compute.storageAdmin (Compute Storage Admin - for managing persistent disks)
                          - roles/compute.instanceAdmin.v1 (Compute Instance Admin - for attaching disks to VMs)
                          - roles/iam.serviceAccountUser (Service Account User - for impersonation)
                          - roles/resourcemanager.tagUser (Tag User - for applying resource tags to disks)
                          See cmd/infra/gcp/iam-bindings.json for the authoritative role definitions.
                          Format: service-account-name@project-id.iam.gserviceaccount.com

                          This is a user-provided value referencing a pre-created Google Service Account.
                          Typically obtained from the output of `hypershift infra create gcp` which creates
                          the required service accounts with appropriate IAM roles and WIF bindings.
                        type: string
                        x-kubernetes-validations:
                        - message: storageEmail is immutable
                          rule: self == oldSelf
                    required:
                    - cloudControllerEmail
                    - controlPlaneEmail
                    - imageRegistryEmail
                    - networkEmail
                    - nodePoolEmail
                    - storageEmail
                    type: object
                required:
                - poolID
                - projectNumber
                - providerID
                - serviceAccountsRef
                type: object
                x-kubernetes-validations:
                - message: workloadIdentity is immutable
                  rule: self == oldSelf
            required:
            - network
            - projectID
            - region
            - subnet
            - workloadIdentity
            type: object
          type:
            description: type specifies the infrastructure provider. Must be "GCP".
            enum:
            - GCP
            type: string
        required:
        - gcp
        - type
        type: object
      release:
        description: release specifies what OpenShift release to use for the cluster.
        properties:
          channelGroup:
            description: |-
              channelGroup selects a platform-managed Channel used to choose and resolve
              the release (for example, stable, fast, eus, candidate, or nightly).
              Available Channels depend on the environment; channel groups must be
              lowercase DNS labels (not arbitrary DNS subdomain Channel names).
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
          version:
            description: |-
              version is the OpenShift version to install.
              Specified as semver v2 major, minor, patch with an optional prerelease and without a leading "v". (e.g., "4.14.9" or "5.0.0-ec.6")
            maxLength: 63
            minLength: 1
            type: string
            x-kubernetes-validations:
            - message: version must be a valid semantic version with an optional prerelease
                and without a leading 'v' (e.g., 4.14.9 or 5.0.0-ec.6)
              rule: self.matches('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$')
        required:
        - channelGroup
        - version
        type: object
      safeName:
        description: SafeName is a private, immutable, DNS-safe name used for downstream
          HyperShift resources.
        maxLength: 17
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
        x-kubernetes-validations:
        - message: safeName is immutable
          rule: oldSelf == "" || self == oldSelf
    required:
    - networking
    - platform
    - release
    type: object
  status:
    description: status is the most recently observed status of the Cluster.
    properties:
      conditions:
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - type
        x-kubernetes-list-type: map
      controlPlaneUpgrade:
        description: ControlPlaneUpgrade is written by the control-plane-upgrade controller.
        properties:
          completedAt:
            description: CompletedAt is when TargetVersion completed successfully.
            format: date-time
            type: string
          failureMessage:
            description: FailureMessage is set when the upgrade to TargetVersion failed
              or stalled.
            type: string
          failureReason:
            description: FailureReason is set when the upgrade to TargetVersion failed
              or stalled.
            type: string
          requestedAt:
            description: |-
              RequestedAt is when the control-plane-upgrade controller selected or
              requested TargetVersion. It does not indicate that HyperShift has
              accepted or begun rolling it out; ControlPlaneUpgradeProgressing reports
              that separately.
            format: date-time
            type: string
          targetSource:
            description: |-
              TargetSource records whether TargetVersion was selected automatically or
              requested by the customer.
            enum:
            - automatic
            - customer
            type: string
          targetVersion:
            description: TargetVersion is the control-plane version currently selected
              or requested.
            type: string
        type: object
      hostedClusterResult:
        description: HostedClusterResult is written by the hc-adapter.
        properties:
          apiEndpoint:
            type: string
          availableUpdates:
            description: |-
              AvailableUpdates are the update targets advertised by HyperShift for the
              HostedCluster's configured release channel. This is private HC feedback
              used by Gecko controllers.
            items:
              type: string
            type: array
          desiredVersion:
            description: |-
              DesiredVersion is the release currently requested by the HostedCluster.
              This is private HC feedback used by Gecko controllers.
            type: string
          observedConditions:
            description: |-
              ObservedConditions are HyperShift/CVO upgrade-readiness conditions normalized
              by the hc-controller from raw HostedCluster feedback. This field is recalculated
              in full on every reconciliation; a condition type absent from HostedCluster
              feedback is omitted rather than left stale. Consumers should treat an absent
              condition as unknown. This is private HC feedback used by Gecko controllers and is
              intentionally not exposed on the public API — see ControlPlaneUpgradeResult for
              the customer-facing upgrade conditions derived from this data.
            items:
              description: Condition contains details for one aspect of the current
                state of this API Resource.
              properties:
                lastTransitionTime:
                  description: |-
                    lastTransitionTime is the last time the condition transitioned from one status to another.
                    This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                  format: date-time
                  type: string
                message:
                  description: |-
                    message is a human readable message indicating details about the transition.
                    This may be an empty string.
                  maxLength: 32768
                  type: string
                observedGeneration:
                  description: |-
                    observedGeneration represents the .metadata.generation that the condition was set based upon.
                    For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                    with respect to the current state of the instance.
                  format: int64
                  minimum: 0
                  type: integer
                reason:
                  description: |-
                    reason contains a programmatic identifier indicating the reason for the condition's last transition.
                    Producers of specific condition types may define expected values and meanings for this field,
                    and whether the values are considered a guaranteed API.
                    The value should be a CamelCase string.
                    This field may not be empty.
                  maxLength: 1024
                  minLength: 1
                  pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                  type: string
                status:
                  description: status of the condition, one of True, False, Unknown.
                  enum:
                  - "True"
                  - "False"
                  - Unknown
                  type: string
                type:
                  description: type of condition in CamelCase or in foo.example.com/CamelCase.
                  maxLength: 316
                  pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                  type: string
              required:
              - lastTransitionTime
              - message
              - reason
              - status
              - type
              type: object
            type: array
            x-kubernetes-list-map-keys:
            - type
            x-kubernetes-list-type: map
          version:
            type: string
        type: object
      placementResult:
        description: |-
          PlacementResult is written by the placement controller.
          Not exposed on the public API.
        properties:
          baseDomain:
            type: string
          managementClusterName:
            type: string
        type: object
      versionResolution:
        description: |-
          VersionResolution is written by the version-resolution controller.
          Not exposed on the public API.
        properties:
          channelGroup:
            description: |-
              ChannelGroup is the raw channel group from spec.release.channelGroup (e.g. "stable", "nightly").
              Stored to detect channel group changes without reconstructing the Cincinnati channel string.
            type: string
          cincinnatiChannel:
            description: |-
              CincinnatiChannel is the channel string used to query Cincinnati (e.g. "stable-4.16").
              Derived from ChannelGroup and the major.minor of ReleaseVersion.
            type: string
          releaseImage:
            description: ReleaseImage is the resolved OCP release pullspec (e.g. quay.io/openshift-release-dev/ocp-release@sha256:...).
            type: string
          releaseVersion:
            description: ReleaseVersion is the resolved OCP version string (e.g. "4.16.3").
            type: string
        type: object
    type: object
required:
- spec
type: object
