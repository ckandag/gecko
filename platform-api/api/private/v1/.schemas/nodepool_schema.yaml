description: NodePool enables declarative management of a pool of nodes.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec defines the desired behavior of the NodePool.
    properties:
      autoscaling:
        description: |-
          autoscaling specifies auto-scaling behavior for the NodePool.
          autoscaling is mutually exclusive with nodeCount. If nodeCount is set, this field must be omitted.
        properties:
          max:
            description: max is the maximum number of nodes allowed in the pool. Must
              be >= 1 and >= Min.
            format: int32
            maximum: 500
            minimum: 1
            type: integer
          min:
            description: |-
              min is the minimum number of nodes to maintain in the pool.
              Can be set to 0 to allow the pool to scale down completely.
              Must be >= 0 and <= .Max.
            format: int32
            minimum: 0
            type: integer
        required:
        - max
        - min
        type: object
        x-kubernetes-validations:
        - message: max must be greater than or equal to min
          rule: self.max >= self.min
      clusterID:
        description: |-
          clusterID is the name of the Cluster this NodePool belongs to.
          If a Cluster with this name doesn't exist, the controller will no-op until it exists.
        maxLength: 253
        minLength: 1
        type: string
        x-kubernetes-validations:
        - message: clusterID is immutable
          rule: self == oldSelf
        - message: clusterID must consist of lowercase alphanumeric characters or
            '-', start and end with an alphanumeric character, and be between 1 and
            253 characters
          rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      nodeCount:
        description: |-
          nodeCount is the desired number of nodes the pool should maintain. If unset, the controller default value is 0.
          nodeCount is mutually exclusive with autoscaling. If autoscaling is configured, nodeCount must be omitted and autoscaling will control the NodePool size internally.
        format: int32
        minimum: 0
        type: integer
      nodeLabels:
        additionalProperties:
          type: string
        description: |-
          nodeLabels propagates a list of labels to Nodes, only once on creation.
          Valid values are those in https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
        maxProperties: 50
        type: object
      platform:
        description: |-
          platform specifies the underlying infrastructure provider for the NodePool
          and is used to configure platform specific behavior.
        properties:
          gcp:
            properties:
              diskSizeGB:
                default: 64
                description: |-
                  diskSizeGB specifies the size of the boot disk in gigabytes.
                  Must be at least 20 GB for RHCOS images.
                format: int64
                maximum: 65536
                minimum: 20
                type: integer
              diskType:
                default: pd-balanced
                description: |-
                  diskType specifies the disk type for the boot disk.
                  Valid values include:
                    - "pd-standard" - Standard persistent disk (magnetic)
                    - "pd-ssd" - SSD persistent disk
                    - "pd-balanced" - Balanced persistent disk (recommended)
                  If not specified, defaults to "pd-balanced".
                enum:
                - pd-standard
                - pd-ssd
                - pd-balanced
                type: string
              machineType:
                description: |-
                  machineType is the GCP machine type for node instances (e.g. n2-standard-4).
                  Must follow GCP machine type naming conventions as documented at:
                  https://cloud.google.com/compute/docs/machine-resource#machine_type_comparison

                  Valid machine type formats:
                    - predefined: n1-standard-1, n2-highmem-4, c2-standard-8, etc.
                    - custom: custom-{cpus}-{memory} (e.g. custom-4-8192)
                    - custom with extended memory: custom-{cpus}-{memory}-ext (e.g. custom-2-13312-ext)
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: machineType must start and end with a lowercase letter
                    or digit, and contain only lowercase letters, digits, and hyphens
                  rule: self.matches('^[a-z0-9]+(-[a-z0-9]+)*$')
              networkTags:
                description: |-
                  networkTags is an optional list of network tags to apply to node instances.
                  These tags are used by GCP firewall rules to control network access.
                  Tags must conform to GCP naming conventions:
                    - 1-63 characters
                    - Lowercase letters, numbers, and hyphens only
                    - Must start with lowercase letter
                    - Cannot end with hyphen
                items:
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              onHostMaintenance:
                description: |-
                  onHostMaintenance specifies the behavior when host maintenance occurs.
                  For Spot and Preemptible instances, this must be "TERMINATE".
                  For Standard instances, can be "MIGRATE" (live migrate) or "TERMINATE".
                  If not specified, defaults to "MIGRATE" for Standard instances and "TERMINATE" for Spot/Preemptible.
                enum:
                - MIGRATE
                - TERMINATE
                type: string
              provisioningModel:
                default: Standard
                description: |-
                  provisioningModel specifies the provisioning model for node instances.
                  Spot and Preemptible instances cost less but can be terminated by GCP with 30 seconds notice.
                  Spot instances are recommended over Preemptible as they have no maximum runtime limit.
                  Standard instances are regular VMs that run until explicitly stopped.
                  If not specified, defaults to "Standard".
                enum:
                - Standard
                - Spot
                - Preemptible
                type: string
              resourceLabels:
                description: |-
                  resourceLabels is an optional list of additional labels to apply to GCP node
                  instances and their associated resources (disks, etc.).
                  Labels will be merged with cluster-level resource labels, with NodePool labels
                  taking precedence in case of conflicts.

                  Keys and values must conform to GCP labeling requirements:
                    - Keys: 1–63 chars, must start with a lowercase letter; allowed [a-z0-9_-]
                    - Values: empty or 1–63 chars; allowed [a-z0-9_-]
                    - Maximum 60 user labels per resource (GCP limit is 64 total, with ~4 reserved)
                items:
                  description: GCPResourceLabel is a label applied to GCP resources.
                  properties:
                    key:
                      maxLength: 63
                      minLength: 1
                      type: string
                    value:
                      maxLength: 63
                      type: string
                  required:
                  - key
                  type: object
                maxItems: 60
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              subnet:
                description: |-
                  subnet is the name of the subnet where node instances will be created.
                  Must be a subnet within the VPC network specified in the HostedCluster's
                  networkConfig and located in the same region as the zone.
                  The subnet must have enough IP addresses available for the expected number of nodes.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: subnet is immutable
                  rule: self == oldSelf
                - message: 'subnet must be a valid GCP subnet name: start with a lowercase
                    letter, contain only lowercase letters, digits, or hyphens, and
                    end with a letter or digit'
                  rule: self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
              zone:
                description: |-
                  zone is the GCP zone where node instances will be created.
                  Must be a valid zone within the cluster's region.
                  Format: {region}-{zone} (e.g. us-central1-a, europe-west2-b)
                  See https://cloud.google.com/compute/docs/regions-zones for available zones.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: zone must be in the form of region-zone (e.g., us-central1-a)
                  rule: self.matches('^[a-z]+(?:-[a-z0-9]+)*-[a-z]$')
                - message: zone is immutable
                  rule: self == oldSelf
            required:
            - machineType
            - subnet
            - zone
            type: object
          type:
            enum:
            - GCP
            type: string
        required:
        - type
        type: object
      release:
        description: release specifies what OpenShift release to use for the node
          pool.
        properties:
          channelGroup:
            description: |-
              channelGroup selects a platform-managed Channel used to choose and resolve
              the release (for example, stable, fast, eus, candidate, or nightly).
              Available Channels depend on the environment; channel groups must be
              lowercase DNS labels (not arbitrary DNS subdomain Channel names).
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
          upgradeStartTime:
            description: |-
              upgradeStartTime is the earliest time a NodePool version upgrade may start.
              Omit it for an immediate upgrade. Scheduling initial installation is not supported.
              Clear a pending schedule with a JSON merge PATCH setting this field to null.
            format: date-time
            type: string
          version:
            description: |-
              version is the OpenShift version to install.
              Specify a complete semantic version, with an optional prerelease and without
              a leading "v" (for example, "4.23.9" or "5.0.0-ec.6").
            maxLength: 63
            minLength: 1
            type: string
            x-kubernetes-validations:
            - message: version must be a valid semantic version with an optional prerelease
                and without a leading 'v' (e.g., 4.14.9 or 5.0.0-ec.6)
              rule: self.matches('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$')
        required:
        - channelGroup
        - version
        type: object
      taints:
        description: |-
          taints if specified, propagates a list of taints to Nodes, only once on creation.
          These taints are additive to the ones applied by other controllers
        items:
          description: |-
            TaintSpec is as v1 Core but without TimeAdded.
            https://github.com/kubernetes/kubernetes/blob/ed8cad1e80d096257921908a52ac69cf1f41a098/staging/src/k8s.io/api/core/v1/types.go#L3037-L3053
            Validation replicates the same validation as the upstream https://github.com/kubernetes/kubernetes/blob/9a2a7537f035969a68e432b4cc276dbce8ce1735/pkg/util/taints/taints.go#L273.
            See also https://kubernetes.io/docs/concepts/overview/working-with-objects/names/.
          properties:
            effect:
              description: |-
                effect is the effect of the taint on pods
                that do not tolerate the taint.
                Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
              enum:
              - NoSchedule
              - PreferNoSchedule
              - NoExecute
              type: string
            key:
              description: key is the taint key to be applied to a node.
              maxLength: 253
              minLength: 1
              type: string
              x-kubernetes-validations:
              - message: key must be a qualified name with an optional subdomain prefix
                  e.g. example.com/MyName
                rule: self.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\\/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
            value:
              description: value is the taint value corresponding to the taint key.
              maxLength: 63
              type: string
              x-kubernetes-validations:
              - message: Value must start and end with alphanumeric characters and
                  can only contain '-', '_', '.' in the middle
                rule: self.matches('^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$')
          required:
          - effect
          - key
          type: object
        maxItems: 50
        type: array
        x-kubernetes-list-map-keys:
        - key
        - effect
        x-kubernetes-list-type: map
    required:
    - clusterID
    - platform
    - release
    type: object
    x-kubernetes-validations:
    - message: nodeCount and autoscaling are mutually exclusive
      rule: '!has(self.nodeCount) || !has(self.autoscaling)'
  status:
    description: status is the most recently observed status of the NodePool.
    properties:
      conditions:
        description: |-
          conditions represents the latest available observations of the node pool's
          current state.
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - type
        x-kubernetes-list-type: map
      version:
        description: |-
          version is the last OpenShift version observed as applied to this
          NodePool. It does not advance merely because an upgrade was requested.
        type: string
      versionResolution:
        description: |-
          VersionResolution is written by the nodepool-vr controller.
          Not exposed on the public API.
        properties:
          channelGroup:
            description: |-
              ChannelGroup is the raw channel group from spec.release.channelGroup (e.g. "stable", "nightly").
              Stored to detect channel group changes without reconstructing the Cincinnati channel string.
            type: string
          cincinnatiChannel:
            description: |-
              CincinnatiChannel is the channel string used to query Cincinnati (e.g. "stable-4.16").
              Derived from ChannelGroup and the major.minor of ReleaseVersion.
            type: string
          releaseImage:
            description: ReleaseImage is the resolved OCP release pullspec (e.g. quay.io/openshift-release-dev/ocp-release@sha256:...).
            type: string
          releaseVersion:
            description: ReleaseVersion is the resolved OCP version string (e.g. "4.16.3").
            type: string
        type: object
    type: object
required:
- spec
type: object
