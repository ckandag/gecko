description: |-
  ControlPlaneUpgradeRequest records a one-time, customer-initiated control-plane
  upgrade. Creating a request does not change the Cluster's release version;
  the control-plane-upgrade controller applies accepted requests.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: ControlPlaneUpgradeRequestSpec identifies the Cluster and selected
      target.
    properties:
      clusterID:
        description: ClusterID is the Cluster name in the same namespace.
        minLength: 1
        type: string
      targetVersion:
        description: TargetVersion is an update advertised by the Cluster's HostedCluster.
        maxLength: 63
        minLength: 1
        type: string
    required:
    - clusterID
    - targetVersion
    type: object
  status:
    description: |-
      ControlPlaneUpgradeRequestStatus records the controller's decision on this
      request. Rollout progress remains on Cluster.status.controlPlaneUpgrade.
    properties:
      decidedAt:
        format: date-time
        type: string
      decision:
        enum:
        - Accepted
        - Rejected
        type: string
      reason:
        type: string
    type: object
required:
- spec
type: object
