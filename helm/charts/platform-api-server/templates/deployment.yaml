{{- include "platform-api-server.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-api-server.fullname" . }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "platform-api-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "platform-api-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-api-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if and .Values.gateway.enabled (gt (int .Values.gateway.shutdownDelaySeconds) 0) }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.gateway.shutdownDelaySeconds }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --address=0.0.0.0
            - --private-port={{ .Values.tls.port }}
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-key-file=/etc/tls/tls.key
            - --public-port={{ .Values.publicApi.port }}
            - --enable-public-api={{ .Values.publicApi.enabled }}
            {{- if .Values.publicApi.replicationWriteGuard.enabled }}
            - --replication-write-guard
            - --region={{ required "publicApi.replicationWriteGuard.region is required when the guard is enabled" .Values.publicApi.replicationWriteGuard.region }}
            - --leader-region={{ required "publicApi.replicationWriteGuard.leaderRegion is required when the guard is enabled" .Values.publicApi.replicationWriteGuard.leaderRegion }}
            - --replicate={{ required "publicApi.replicationWriteGuard.replicate is required when the guard is enabled" .Values.publicApi.replicationWriteGuard.replicate }}
            {{- end }}
            {{- if .Values.esp.enabled }}
            - --public-address=127.0.0.1
            {{- else if .Values.publicApi.bindAddress }}
            - --public-address={{ .Values.publicApi.bindAddress }}
            {{- end }}
            {{- if .Values.corsOrigins }}
            - --cors-origins={{ join "," .Values.corsOrigins }}
            {{- end }}
          {{- if or .Values.featureFlags.enabled .Values.spanner.enabled .Values.alloydb.enabled }}
          env:
            {{- if .Values.featureFlags.enabled }}
            - name: FLAGD_OFFLINE_FLAG_SOURCE_PATH
              value: {{ printf "%s/flags.json" (trimSuffix "/" .Values.featureFlags.mountPath) | quote }}
            - name: FLAGD_OFFLINE_POLL_MS
              value: {{ .Values.featureFlags.offlinePollMs | quote }}
            {{- end }}
            {{- if .Values.spanner.enabled }}
            - name: SPANNER_DATABASE
              value: {{ printf "projects/%s/instances/%s/databases/%s" .Values.spanner.projectId .Values.spanner.instanceId .Values.spanner.databaseId | quote }}
            - name: SKIP_DDL_SETUP
              value: "true"
            {{- if .Values.spanner.tablePrefix }}
            - name: SPANNER_TABLE_PREFIX
              value: {{ .Values.spanner.tablePrefix | quote }}
            {{- end }}
            {{- else if .Values.alloydb.enabled }}
            - name: DB_HOST
              value: {{ required "alloydb.host is required when alloydb is enabled (set after AlloyDB instance is provisioned)" .Values.alloydb.host | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.alloydb.database | quote }}
            - name: DB_USER
              value: {{ .Values.alloydb.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-db" (include "platform-api-server.fullname" .)) .Values.alloydb.auth.existingSecret }}
                  key: password
            - name: DB_SSLMODE
              value: {{ .Values.alloydb.sslMode | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.tls.port }}
              name: https
              protocol: TCP
            {{- if .Values.publicApi.enabled }}
            - containerPort: {{ .Values.publicApi.port }}
              name: public-api
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            {{- if .Values.featureFlags.enabled }}
            - name: feature-flags
              mountPath: {{ .Values.featureFlags.mountPath | quote }}
              readOnly: true
            {{- end }}
        {{- if .Values.esp.enabled }}
        - name: esp
          {{- if and .Values.gateway.enabled (gt (int .Values.gateway.shutdownDelaySeconds) 0) }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.gateway.shutdownDelaySeconds }}
          {{- end }}
          image: {{ .Values.esp.image }}
          args:
            - --listener_port={{ .Values.esp.port }}
            - --backend=127.0.0.1:{{ .Values.publicApi.port }}
            - '--service={{ required "esp.serviceName must be set when esp is enabled" .Values.esp.serviceName }}'
            - --rollout_strategy=managed
            - --cors_preset=cors_with_regex
            - --cors_allow_origin_regex=^https://(console|hybrid-cloud-console)\.redhat\.com$
            - --cors_allow_methods=GET,POST,PATCH,DELETE,OPTIONS
            - --cors_allow_headers=Content-Type,Authorization,X-Request-ID
            - --cors_allow_credentials
            - --cors_max_age=86400s
            - --healthz=/healthz
          ports:
            - name: esp-http
              containerPort: {{ .Values.esp.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.esp.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.esp.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 111
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: esp-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "platform-api-server.fullname" . }}-tls
        {{- if .Values.featureFlags.enabled }}
        - name: feature-flags
          configMap:
            name: {{ default (printf "%s-feature-flags" (include "platform-api-server.fullname" .)) .Values.featureFlags.configMapName }}
        {{- end }}
        {{- if .Values.esp.enabled }}
        - name: esp-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
