{{- if or .Values.gateway.globalAuthorization.enabled .Values.gateway.globalAuthorization.certificate.enabled }}
{{- $hostname := required "gateway.globalAuthorization.hostname must be set when enabled" .Values.gateway.globalAuthorization.hostname -}}
{{- $projectId := required "gateway.projectId must be set when global authorization is enabled" .Values.gateway.projectId -}}
{{- $authorization := required "gateway.globalAuthorization.certificate.dnsAuthorization must be set when enabled" .Values.gateway.globalAuthorization.certificate.dnsAuthorization -}}
---
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificate
metadata:
  name: {{ .Values.gateway.globalAuthorization.certificate.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: global-authorization-certificate
spec:
  location: global
  managed:
    domains:
      - {{ $hostname | quote }}
    dnsAuthorizationsRefs:
      - external: {{ $authorization | quote }}
  projectRef:
    external: {{ $projectId | quote }}
{{- end }}
