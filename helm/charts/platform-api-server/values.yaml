replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-platform-api-server
  tag: "365ddef"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

apiService:
  group: gcp.managed.openshift.io
  version: v1
  groupPriorityMinimum: 1000
  versionPriority: 15

tls:
  port: 8443
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer

publicApi:
  enabled: true
  port: 8081
  # ESPv2 deployments always bind the public listener to loopback. When ESPv2
  # is disabled and the public API is enabled, set this explicitly (for
  # example, to 0.0.0.0) to expose the public Service port.
  bindAddress: ""

platformRoles:
  # System PlatformRoles are managed by Helm/private API and are never
  # projected to the public API.
  enabled: true

corsOrigins: []

featureFlags:
  # Mount a flagd-compatible configuration file when enabled.
  enabled: false
  # Set createConfigMap=false when the ConfigMap is managed by a separate
  # ArgoCD feature-flags application.
  createConfigMap: true
  configMapName: ""
  mountPath: /etc/gecko/flags
  offlinePollMs: 5000
  flags: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podDisruptionBudget:
  enabled: true
  minAvailable: 1

revisionHistoryLimit: 10
# Allow the Gateway NEG to detach the Pod before either container exits.
terminationGracePeriodSeconds: 210

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []

gateway:
  enabled: true
  # Keep both containers serving while GKE removes a terminating Pod from the
  # Gateway NEG. The kubelet sleep hook does not require a shell in either image.
  shutdownDelaySeconds: 120
  connectionDraining:
    enabled: true
    drainingTimeoutSec: 60
  name: platform-external-gateway
  namespace: platform-gateway
  hostname: ""
  projectId: ""
  service:
    name: platform-api-gateway-svc
    port: 8081
  healthCheck:
    requestPath: /livez
    type: HTTP
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  certificate:
    enabled: true
    name: platform-api-cert
    certificateMap:
      name: platform-gateway-certmap
  # Cloud Armor: deploys a ComputeSecurityPolicy (WAF + rate limiting)
  # and a GCPBackendPolicy that binds it to the gateway service.
  cloudArmor:
    enabled: false
    # WAF sensitivity levels (1-4). Level 1 = highest confidence, fewest false
    # positives. Level 4 = maximum detection, most false positives. All rules
    # default to 1 because JSON API payloads contain URLs, email addresses, and
    # path-like strings that trigger false positives at higher sensitivities.
    wafSensitivity:
      sqli: 1
      xss: 1
      rfi: 1
      lfi: 1
      rce: 1
      scannerdetection: 1
    rateLimit:
      requestsPerMinute: 100
      banRequestsPerMinute: 500
      banDurationSec: 300

# ESPv2 sidecar for Cloud Endpoints integration.
# Requires the pod's service account to have roles/servicemanagement.serviceController
# on the GCP project that owns the Cloud Endpoints service (serviceName).
# Configure Workload Identity via serviceAccount.annotations to bind the KSA to a GSA
# with the required IAM role.
esp:
  enabled: true
  image: gcr.io/endpoints-release/endpoints-runtime:2.57.1
  port: 9080
  serviceName: ""

alloydb:
  enabled: false
  projectId: ""
  location: "us-central1"
  host: ""
  networkRef: "default"
  databaseVersion: "POSTGRES_15"
  cpuCount: 2
  auth:
    username: "orlop"
    password: ""
    existingSecret: ""
  database: "orlop"
  sslMode: "require"

# Google Cloud Spanner backend via Config Connector (CNRM).
# The Spanner instance is shared infrastructure provisioned by the region
# Terraform module (gcp-hcp-infra), named ${project_id}-spanner. This chart
# only creates a KCC SpannerDatabase inside that preexisting instance and
# configures the deployment with the SPANNER_DATABASE env var.
# Requires the Config Connector (cnrm.cloud.google.com) operator to be
# installed in the cluster and the pod's service account to be bound to a
# GCP service account via Workload Identity.
#
# IAM separation: an ArgoCD PreSync Job runs DDL migrations with
# roles/spanner.databaseAdmin using a dedicated service account, then the
# Deployment starts with only roles/spanner.databaseUser for data-plane
# operations. The two workloads use separate Kubernetes and GCP service
# accounts so the long-running app never holds admin privileges.
spanner:
  enabled: false
  projectId: ""
  instanceId: ""
  databaseId: "gecko"
  # Optional prefix for Spanner table names (e.g. "myapp_" creates
  # "myapp_counters", "myapp_resources"). Must match between the migration
  # Job and Deployment. Leave empty for no prefix.
  tablePrefix: ""
  # Dedicated service account for the migration PreSync Job. This KSA is
  # bound via Workload Identity to a GCP service account with
  # roles/spanner.databaseAdmin, separate from the Deployment's KSA.
  migration:
    serviceAccount:
      create: true
      # Name override. Defaults to "<fullname>-migrate".
      name: ""
      # Annotations for Workload Identity binding, e.g.:
      #   iam.gke.io/gcp-service-account: "my-migrate-gsa@project.iam.gserviceaccount.com"
      annotations: {}
  # IAM grants on the SpannerDatabase created by this chart.
  #
  # Two separate GCP service accounts are used:
  #   serviceAccount          - Deployment's GSA, gets databaseUser (data read/write)
  #   migrationServiceAccount - Migration Job's GSA, gets databaseAdmin (DDL only)
  #
  # Leave either empty to skip the corresponding IAM grant (e.g. when IAM
  # is managed outside this chart).
  iam:
    serviceAccount: ""
    role: "roles/spanner.databaseUser"
    migrationServiceAccount: ""
    migrationRole: "roles/spanner.databaseAdmin"
