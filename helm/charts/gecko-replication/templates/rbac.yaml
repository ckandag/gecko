{{- if .Values.enabled }}
{{- $resourceByID := dict
  "roles.gcp.managed.openshift.io" "roles"
  "rolebindings.gcp.managed.openshift.io" "rolebindings"
-}}
{{- $resources := list -}}
{{- range $rawID := splitList "," .Values.replicate -}}
  {{- $id := trim $rawID -}}
  {{- if $id -}}
    {{- if not (hasKey $resourceByID $id) -}}
      {{- fail (printf "unsupported replicated resource %q in replicate; update chart RBAC when adding a supported type" $id) -}}
    {{- end -}}
    {{- $resource := get $resourceByID $id -}}
    {{- if not (has $resource $resources) -}}
      {{- $resources = append $resources $resource -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if eq (len $resources) 0 -}}
  {{- fail "replicate must contain at least one supported resource" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-replication.fullname" . }}
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
rules:
  - apiGroups: [gcp.managed.openshift.io]
    resources: {{ $resources | toJson }}
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-replication.fullname" . }}
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-replication.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-replication.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
