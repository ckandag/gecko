{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-replication.fullname" . }}
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
rules:
  - apiGroups: [gcp.managed.openshift.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch{{ if ne .Values.region .Values.leaderRegion }}, create, update, patch, delete{{ end }}]
  {{- if ne .Values.region .Values.leaderRegion }}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-replication.fullname" . }}
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-replication.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-replication.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
