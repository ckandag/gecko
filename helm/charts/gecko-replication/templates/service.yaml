{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gecko-replication.fullname" . }}-metrics
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: gecko-replication
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
{{- end }}
