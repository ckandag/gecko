{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gecko-replication.serviceAccountName" . }}
  labels:
    {{- include "gecko-replication.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ include "gecko-replication.gcpServiceAccount" . | quote }}
{{- end }}
